<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <main class="pagina">
      <section class="tarjeta" style="margin-top: 0">
        <h2>Contacto</h2>
        <p>
          ¿Tienes alguna consulta técnica, duda sobre mis prácticas o propuesta de colaboración? 
          Envíame un mensaje mediante el formulario o ponte en contacto directo:
        </p>
        <p style="margin-top: 0.8rem; color: var(--text);">
          <strong>Francisco Castellanos Loreto</strong><br>
          <span style="color: var(--muted); font-size: 0.9rem;">Acapulco, Guerrero, México &bull; Estudiante de ISC en TecNM Campus Acapulco</span>
        </p>
      </section>

      <section class="tarjeta">
        <h2>Envíame un mensaje</h2>

        <form
          class="formulario"
          action="#"
          method="post"
          onsubmit="event.preventDefault(); alert('Mensaje enviado correctamente.');"
        >
          <label for="nombre">Nombre completo</label>
          <input
            type="text"
            id="nombre"
            name="Nombre completo"
            autocomplete="name"
            placeholder="Tu nombre completo"
            required
          />

          <label for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            name="Correo"
            autocomplete="email"
            placeholder="tucorreo@ejemplo.com"
            required
          />

          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="Mensaje" placeholder="Escribe tu mensaje..." required></textarea>

          <button type="submit">Enviar mensaje</button>
        </form>
      </section>
    </main>
  </body>
</html>
