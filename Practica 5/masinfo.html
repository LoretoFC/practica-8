<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obtener Más Información</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif; 
      }
      
      body {
        background-color: #fceceb; 
        margin: 0;
        padding: 20px;
      }

      .encabezado {
        text-align: center;
        font-weight: bold;
        margin-bottom: 40px;
      }

      .texto-superior {
        color: #800020; 
        font-size: 36px;
        margin: 10px 0;
      }

      .caja-central {
        background-color: #ffdf6b; 
        padding: 20px;
        margin: 15px 0;
      }

      .caja-central h1 {
        color: #004aad; 
        margin: 0;
        font-size: 40px;
      }

      input[type="text"],
      input[type="email"],
      textarea {
        width: 400px;
        padding: 8px;
        background-color: #dcedc8;
        border-radius: 4px;
        border: 1px solid #b5d596; 
      }
      
      input[type="submit"] {
        padding: 10px 16px;
        background-color: #0085c8;
        color: #fff;
        border: none;
        border-radius: 4px;
        margin-top: 15px;
        cursor: pointer;
      }
      
      table td {
        padding: 8px;
      }
    </style>
  </head>
  <body>
    
    <div class="encabezado">
      <div class="texto-superior">Obtener Más Información</div>
    </div>

    <center>
      <form action="">
        <table>
          <tbody>
            <tr>
              <td>Ingresa tu Nombre:</td>
              <td><input type="text" placeholder="Francisco" /></td>
            </tr>
            <tr>
              <td>Ingresa tu Apellido:</td>
              <td><input type="text" placeholder="Castellanos Loreto" /></td>
            </tr>
            <tr>
              <td>Ingresa información:</td>
              <td>
                <textarea name="" id=""></textarea>
              </td>
            </tr>
            <tr>
              <td>Ingresa tu correo:</td>
              <td><input type="email" placeholder="alguien1234@dominio.com" /></td>
            </tr>
            <tr>
              <td></td>
              <td>
                <input type="submit" value="Enviar datos" />
              </td>
            </tr>
          </tbody>
        </table>
      </form>
    </center>
  </body>
</html>
